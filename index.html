    <style>

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .nav-underline { position: relative; }
        .nav-underline::after {
            content: ''; position: absolute; width: 100%; transform: scaleX(0);
            height: 1px; bottom: -4px; left: 0; background-color: currentColor;
            transform-origin: bottom right; transition: transform 0.25s ease-out;
        }
        .nav-underline:hover::after, .nav-underline.active::after {
            transform: scaleX(1); transform-origin: bottom left;
        }
        img { image-rendering: auto; }

        function switchSection(sectionId) {
            const sections = ['main', 'film', 'photography'];
            sections.forEach(sec => {
                const element = document.getElementById(`section-${sec}`);
                if (element) {
                    element.classList.add('hidden');
                    element.classList.remove('opacity-100');
                    element.classList.add('opacity-0');
                }
                const navLink = document.getElementById(`nav-${sec}`);
                if (navLink) {
                    navLink.classList.remove('active', 'text-zinc-900', 'dark:text-white');
                    navLink.classList.add('text-zinc-500');
                }
            });

            const activeSection = document.getElementById(`section-${sectionId}`);
            if (activeSection) {
                activeSection.classList.remove('hidden');
                setTimeout(() => {
                    activeSection.classList.remove('opacity-0');
                    activeSection.classList.add('opacity-100');
                }, 50);
            }

            const activeNav = document.getElementById(`nav-${sectionId}`);
            if (activeNav) {
                activeNav.classList.add('active', 'text-zinc-900', 'dark:text-white');
                activeNav.classList.remove('text-zinc-500');
            }

            if (sectionId === 'film') {
                activeCategory = 'film';
                currentImageArray = filmImages;
            } else if (sectionId === 'photography') {
                closeCategory();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showCategory(catId) {

            if (catId === 'texture') currentImageArray = textureImages;
            else if (catId === 'morocco') currentImageArray = moroccoImages;
            else if (catId === 'korea') currentImageArray = koreaImages;
            else if (catId === 'beings') currentImageArray = beingsImages;

            document.getElementById('photography-categories').classList.add('hidden');

            const galleries = ['texture', 'morocco', 'korea', 'beings'];
            galleries.forEach(g => {
                const el = document.getElementById(`gallery-${g}`);
                if (el) {
                    el.classList.add('hidden');
                    el.classList.remove('opacity-100');
                    el.classList.add('opacity-0');
                }
            });

            if (selected) {
                selected.classList.remove('hidden');
                setTimeout(() => {
                    selected.classList.remove('opacity-0');
                    selected.classList.add('opacity-100');
                }, 50);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeCategory() {
            activeCategory = 'photography';
            currentImageArray = [];
            
            const galleries = ['texture', 'morocco', 'korea', 'beings'];
            galleries.forEach(g => {
                const el = document.getElementById(`gallery-${g}`);
                if (el) {
                    el.classList.add('hidden');
                    el.classList.remove('opacity-100');
                    el.classList.add('opacity-0');
                }
            });

            const catGrid = document.getElementById('photography-categories');
            if (catGrid) {
                catGrid.classList.remove('hidden');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openLightbox(url, title) {
            const lightbox = document.getElementById('lightbox');
            const imgEl = document.getElementById('lightbox-img');
            
            imgEl.src = url;
            document.getElementById('lightbox-title').textContent = title;

            if (activeCategory === 'film') currentImageArray = filmImages;
            else if (activeCategory === 'texture') currentImageArray = textureImages;
            else if (activeCategory === 'morocco') currentImageArray = moroccoImages;
            else if (activeCategory === 'korea') currentImageArray = koreaImages;
            else if (activeCategory === 'beings') currentImageArray = beingsImages;

            currentImageIndex = currentImageArray.findIndex(item => item.url === url);
            if (currentImageIndex === -1) currentImageIndex = 0;

            lightbox.classList.remove('hidden');
            setTimeout(() => lightbox.classList.remove('opacity-0'), 50);
            document.body.classList.add('overflow-hidden');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');
            setTimeout(() => lightbox.classList.add('hidden'), 300);
            document.body.classList.remove('overflow-hidden');
        }

        function handleLightboxBgClick(event) {
            if (event.target.id === 'lightbox-img' || event.target.closest('button')) {
                return;
            }
            closeLightbox();
        }

        function prevLightboxImage(event) {
            if (event) event.stopPropagation();
            if (currentImageArray.length === 0) return;
            currentImageIndex = (currentImageIndex - 1 + currentImageArray.length) % currentImageArray.length;
            updateLightboxContent();
        }

        function nextLightboxImage(event) {
            if (event) event.stopPropagation();
            if (currentImageArray.length === 0) return;
            currentImageIndex = (currentImageIndex + 1) % currentImageArray.length;
            updateLightboxContent();
        }

        function updateLightboxContent() {
            const imgEl = document.getElementById('lightbox-img');
            const titleEl = document.getElementById('lightbox-title');
            const activeObj = currentImageArray[currentImageIndex];
            if (activeObj) {
                imgEl.src = activeObj.url;
                titleEl.textContent = activeObj.title;
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            const sunIcon = document.getElementById('sun-icon');
            const moonIcon = document.getElementById('moon-icon');
            if (isDark) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('hidden')) {
                if (e.key === 'Escape') closeLightbox();
                else if (e.key === 'ArrowLeft') prevLightboxImage();
                else if (e.key === 'ArrowRight') nextLightboxImage();
            }
        });

        window.onload = function() {
            const hash = window.location.hash.replace('#', '');
            if (hash && ['main', 'film', 'photography'].includes(hash)) {
                switchSection(hash);
            } else {
                switchSection('main');
            }
        }
    </script>
</body>
</html>
